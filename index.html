<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Task Planner</title>

    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
        }
        
        body { 
            background-color: #eef1f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
            overflow-x: hidden; 
        }
        
        .planner-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
            max-width: 420px; 
            position: relative; 
        }
        
        .pokemon-box { 
            position: relative; 
            width: 130px; 
            height: 130px; 
            margin-bottom: -10px; 
            z-index: 10; 
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .cat-img {
            font-size: 82px;
            line-height: 1;
            transition: all 0.3s ease;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.12));
            user-select: none;
        }

        .pokemon-box.idle .cat-img {
            animation: cat-walk 1.2s infinite linear;
        }

        .pokemon-box.happy .cat-img {
            animation: cat-jump 0.4s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 10px rgba(255, 180, 0, 0.8));
        }

        .planner-board { 
            width: 100%; 
            background: #ffffff; 
            border-radius: 24px; 
            padding: 25px; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.06); 
            border: 3px solid #e0e6ed; 
            position: relative; 
        }
        
        .pokemon-selector { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            margin-bottom: 20px; 
            background: #f4f7fa; 
            padding: 8px 12px; 
            border-radius: 50px; 
            border: 1px solid #e6ecf2;
        }

        .poke-opt { 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            border: 2px solid transparent; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 22px;
            user-select: none;
        }

        .poke-opt:hover { 
            transform: scale(1.2); 
        }

        .poke-opt.active { 
            border-color: #ff9f1c; 
            transform: scale(1.15); 
            box-shadow: 0 0 8px rgba(255, 159, 28, 0.35); 
        }

        .header-title { 
            text-align: center; 
            color: #2b2d42; 
            font-size: 18px; 
            font-weight: 800; 
            margin-bottom: 15px; 
            letter-spacing: 1px;
        }

        .input-group { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
        }

        .input-group input { 
            flex: 1; 
            padding: 12px 16px; 
            border: 2px solid #e2e8f0; 
            border-radius: 14px; 
            outline: none; 
            font-size: 14px;
            transition: all 0.3s; 
        }

        .input-group input:focus { 
            border-color: #ff9f1c; 
            box-shadow: 0 0 0 4px rgba(255, 159, 28, 0.15); 
        }

        .input-group button { 
            background: #ff9f1c; 
            color: white; 
            border: none; 
            padding: 0 20px; 
            border-radius: 14px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s; 
        }

        .input-group button:hover { 
            background: #f77f00; 
            transform: translateY(-1px); 
        }
        
        .task-list { 
            list-style: none; 
            max-height: 260px; 
            overflow-y: auto; 
        }

        .task-item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px 14px; 
            background: #f8fafc; 
            border: 1px solid #edf2f7; 
            border-radius: 12px; 
            margin-bottom: 10px; 
            animation: slideIn 0.3s ease; 
            transition: all 0.2s; 
        }

        .task-item:hover { 
            transform: translateX(4px); 
            background: #fff7ed; 
            border-color: #fed7aa;
        }

        .task-left { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            flex: 1; 
        }
        
        .todo-checkbox { 
            appearance: none; 
            -webkit-appearance: none; 
            width: 22px; 
            height: 22px; 
            border: 2px solid #cbd5e1; 
            border-radius: 50%; 
            display: grid; 
            place-content: center; 
            cursor: pointer; 
            background: white; 
            transition: all 0.2s; 
        }

        .todo-checkbox::before { 
            content: ""; 
            width: 10px; 
            height: 10px; 
            background-color: #ff9f1c; 
            border-radius: 50%; 
            transform: scale(0); 
            transition: 0.15s transform ease; 
        }

        .todo-checkbox:checked { 
            border-color: #ff9f1c; 
        }

        .todo-checkbox:checked::before { 
            transform: scale(1); 
        }

        .todo-checkbox:checked + .task-text { 
            text-decoration: line-through; 
            color: #94a3b8; 
        }
        
        .delete-btn { 
            background: none; 
            border: none; 
            color: #cbd5e1; 
            font-size: 20px; 
            cursor: pointer; 
            transition: color 0.2s; 
        }

        .delete-btn:hover { 
            color: #ef4444; 
        }

        .confetti-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
            z-index: 99; 
            overflow: hidden; 
        }

        .confetti { 
            position: absolute; 
            width: 6px; 
            height: 6px; 
            border-radius: 50%; 
            animation: fall 1.5s linear forwards; 
        }

        @keyframes cat-walk {
            0%, 100% { 
                transform: translateY(0) rotate(0deg); 
            }
            50% { 
                transform: translateY(-5px) rotate(3deg); 
            }
        }

        @keyframes cat-jump {
            0% { 
                transform: translateY(0) scale(1); 
            }
            100% { 
                transform: translateY(-28px) scale(0.95); 
            }
        }

        @keyframes slideIn { 
            from { 
                opacity: 0; 
                transform: translateY(8px); 
            } 
            to { 
                opacity: 1; 
                transform: translateY(0); 
            } 
        }

        @keyframes fall { 
            0% { 
                transform: translateY(-10px) rotate(0deg); 
                opacity: 1; 
            } 
            100% { 
                transform: translateY(380px) rotate(360deg); 
                opacity: 0; 
            } 
        }
    </style>
</head>

<body>
    <div class="planner-container">
        <div class="pokemon-box idle" id="poke-companion">
            <div class="cat-img" id="poke-img">🐱</div>
        </div>

        <div class="planner-board">
            <div class="confetti-container" id="confetti-box"></div>
            
            <div class="pokemon-selector">
                <div class="poke-opt active" data-poke="cat1" title="Mèo đen">🐈‍⬛</div>
                <div class="poke-opt" data-poke="cat2" title="Mèo vui vẻ">😼</div>
                <div class="poke-opt" data-poke="cat3" title="Lạc đà">🐪</div>
                <div class="poke-opt" data-poke="cat4" title="Thỏ trắng">🐰</div>
                <div class="poke-opt" data-poke="cat5" title="Sóc chuột">🐿️</div>
                <div class="poke-opt" data-poke="cat6" title="Gấu Bắc Cực">🐻‍❄️</div>
                <div class="poke-opt" data-poke="cat7" title="Cá voi">🐳</div>

            </div>

            <h2 class="header-title">🐾 MY PLANNER 🐾</h2>
            
            <div class="input-group">
                <input 
                    type="text" 
                    id="task-input" 
                    placeholder="Hôm nay tụi mình sẽ cùng bạn xử lý việc gì đây..." 
                    maxlength="50"
                >
                <button id="add-btn">Thêm</button>
            </div>

            <ul class="task-list" id="task-list"></ul>
        </div>
    </div>

    <script>
        const pokeCompanion = document.getElementById('poke-companion');
        const pokeImg = document.getElementById('poke-img');
        const taskInput = document.getElementById('task-input');
        const addBtn = document.getElementById('add-btn');
        const taskList = document.getElementById('task-list');
        const confettiBox = document.getElementById('confetti-box');
        const pokeOpts = document.querySelectorAll('.poke-opt');

        const catSprites = {
            cat1: "🐈‍⬛",
            cat2: "😼",
            cat3: "🐪",
            cat4: "🐰",
            cat5: "🐿️",
            cat6: "🐻‍❄️",
            cat7: "🐳"
        };

        let currentPoke = localStorage.getItem('cat_choice') || 'cat1';

        let tasks = JSON.parse(localStorage.getItem('cat_tasks')) || [
            { id: 1, text: 'Chạy bộ 30 phút rèn luyện sức bền', completed: false },
            { id: 2, text: 'Hoàn thành bài tập nghiên cứu', completed: false }
        ];

        pokeImg.textContent = catSprites[currentPoke];

        pokeOpts.forEach(opt => {
            if (opt.dataset.poke === currentPoke) {
                opt.classList.add('active');
            } else {
                opt.classList.remove('active');
            }
        });

        pokeOpts.forEach(opt => {
            opt.addEventListener('click', () => {
                pokeOpts.forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                
                currentPoke = opt.dataset.poke;
                pokeImg.textContent = catSprites[currentPoke];

                localStorage.setItem('cat_choice', currentPoke);
            });
        });

        function renderTasks() {
            taskList.innerHTML = '';

            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = 'task-item';

                li.innerHTML = `
                    <div class="task-left">
                        <input 
                            type="checkbox" 
                            class="todo-checkbox" 
                            ${task.completed ? 'checked' : ''} 
                            data-id="${task.id}"
                        >
                        <span class="task-text">${task.text}</span>
                    </div>
                    <button class="delete-btn" data-id="${task.id}">×</button>
                `;

                taskList.appendChild(li);
            });

            localStorage.setItem('cat_tasks', JSON.stringify(tasks));
        }

        function addTask() {
            const text = taskInput.value.trim();

            if (text === '') return;

            tasks.push({ 
                id: Date.now(), 
                text: text, 
                completed: false 
            });

            taskInput.value = '';
            renderTasks();
        }

        addBtn.addEventListener('click', addTask);

        taskInput.addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') addTask(); 
        });

        taskList.addEventListener('change', (e) => {
            if (e.target.classList.contains('todo-checkbox')) {
                const id = parseInt(e.target.dataset.id);
                const task = tasks.find(t => t.id === id);

                task.completed = e.target.checked;

                localStorage.setItem('cat_tasks', JSON.stringify(tasks));

                if (e.target.checked) {
                    triggerVictoryDance();
                }
            }
        });

        taskList.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                tasks = tasks.filter(t => t.id !== parseInt(e.target.dataset.id));
                renderTasks();
            }
        });

        function triggerVictoryDance() {
            pokeCompanion.className = 'pokemon-box happy';

            for (let i = 0; i < 35; i++) {
                createConfetti();
            }

            setTimeout(() => { 
                pokeCompanion.className = 'pokemon-box idle'; 
            }, 2500);
        }

        function createConfetti() {
            const confetti = document.createElement('div');

            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.top = Math.random() * 20 + '%';

            confetti.style.backgroundColor = [
                '#ff9f1c', 
                '#ffbf69', 
                '#ffd60a', 
                '#f77f00', 
                '#3a86ff', 
                '#ff006e'
            ][Math.floor(Math.random() * 6)];

            confetti.style.transform = `scale(${Math.random() * 1.3 + 0.6})`;
            confetti.style.animationDuration = (Math.random() * 1 + 1) + 's';

            confettiBox.appendChild(confetti);

            setTimeout(() => confetti.remove(), 1500);
        }

        renderTasks();
    </script>
</body>
</html>
